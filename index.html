<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0f1116" />
    <meta name="description" content="Προετοιμασία για τις εξετάσεις ειδικότητας ψυχιατρικής: ερωτήσεις πολλαπλής επιλογής, προφορικά θέματα, SOS υλικό και πινακάκια αναφοράς." />
    <title>Ψυχιατρική Ειδικότητα</title>
    <script>
      // Apply the stored theme before first paint so the sheet never flashes.
      (function () {
        try {
          var t = localStorage.getItem('psych_theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
