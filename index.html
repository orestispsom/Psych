<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0f1116" />
    <meta name="description" content="Προετοιμασία για τις εξετάσεις ειδικότητας ψυχιατρικής: ερωτήσεις πολλαπλής επιλογής, προφορικά θέματα, SOS υλικό και πινακάκια αναφοράς." />
    <title>Ψυχιατρική Ειδικότητα</title>
    <script>
      // Apply the stored theme before first paint so the sheet never flashes.
      (function () {
        try {
          var t = localStorage.getItem('psych_theme');
          if (!t || (t !== 'light' && t !== 'dark')) {
            var raw = localStorage.getItem('psych_study_profiles_v1');
            if (raw) {
              var parsed = JSON.parse(raw);
              if (parsed && parsed.activeProfileId && parsed.profiles && parsed.profiles[parsed.activeProfileId]) {
                t = parsed.profiles[parsed.activeProfileId].themePreference;
              }
            }
          }
          if (t !== 'light' && t !== 'dark') {
            t = 'dark';
          }
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
